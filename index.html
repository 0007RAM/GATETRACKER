:root[data-theme="dark"]{--bg:linear-gradient(135deg,#0d1514,#121428);--fg:#e8ecea;--mut:#8a94a0;--gl:rgba(255,255,255,.06);--bd:rgba(255,255,255,.1);--ac:#4fd1a5;--sb:#10171b;--onac:#04241b;--rd:#ff7b7b;--or:#ffb45c;--gr:#4cd98a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg) fixed;background-color:var(--sb);color:var(--fg);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}

.qt{font-size:clamp(20px,3.4vw,32px);line-height:1.3;font-weight:650;margin:14px 0;letter-spacing:-.01em}.chip{background:rgba(255,255,255,.15);border-radius:12px;padding:3px 10px;font-size:12px}.mir{margin-top:12px;font-style:italic;opacity:.9}
@keyframes fd{from{opacity:0}}.fz aside{display:none}.fz main{margin:0 auto}
.ani .gl{animation:in .3s both}.ani .hero{animation:fd 1.4s both}
.nv{display:flex;gap:8px;align-items:center}.nv.mo{display:none}.btn{display:inline-flex;align-items:center;gap:4px;user-select:none}
input,select{max-width:100%}.row>*{min-width:0}svg{max-width:100%}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:6px}

aside h2,.nv.x{display:none}.nv.mo,aside.open .nv.x{display:flex}.nv{flex:1 1 20%;flex-direction:column;justify-content:center;gap:2px;font-size:20px;min-height:48px}.nv .lb{font-size:10px}main{padding:12px 12px 96px}}
@media(max-width:480px){h1{font-size:19px}.hero{padding:18px;border-radius:16px}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.g2{grid-template-columns:1fr}.st b{font-size:22px}}

@media(min-width:1024px){main{max-width:1100px}}
@media(min-width:1440px){main{max-width:1280px}aside{width:220px}body{font-size:15px}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script>
const S=[
["Engineering Mathematics","Wk 1–3","Rosen (Discrete Maths); Gilbert Strang (Linear Algebra); Grewal/Thomas (Calculus); Sheldon Ross (Probability)",["Propositional & first-order logic","Sets, relations, functions","Partial orders & lattices","Monoids, groups","Graphs: connectivity, matching, colouring","Combinatorics: counting, recurrences, generating functions","Matrices, determinants, linear equations","Eigenvalues & eigenvectors","LU decomposition","Limits, continuity, differentiability","Maxima/minima, mean value theorem","Integration","Random variables & distributions (uniform, normal, exponential, Poisson, binomial)","Mean, median, mode, standard deviation","Conditional probability & Bayes theorem"]],
["Digital Logic","Wk 4","Morris Mano (Digital Design)",["Boolean algebra & minimization (K-map, tabular)","Combinational circuit design","Sequential circuit design","Number representation & arithmetic (fixed/floating)"]],
["Computer Organization & Architecture","Wk 4–5","Hamacher; Hennessy & Patterson; Morris Mano (COA)",["Instruction set & addressing modes","ALU design","Control unit: hardwired & microprogrammed","Memory hierarchy & cache mapping","I/O interface: interrupt & DMA","Pipelining & hazards"]],
["Programming & Data Structures","Wk 6","K&R (The C Programming Language); Reema Thareja; Karumanchi (DS made easy)",["C programming, pointers, storage classes","Recursion","Arrays, stacks, queues","Linked lists","Trees & binary search trees","Binary heaps","Graphs (representation)"]],
["Algorithms","Wk 7","CLRS; Horowitz & Sahni; Dasgupta–Papadimitriou–Vazirani",["Asymptotic time & space complexity","Searching & sorting","Hashing","Greedy","Dynamic programming","Divide & conquer","Graph traversals (BFS/DFS)","Minimum spanning trees","Shortest paths"]],
["Theory of Computation","Wk 8","Ullman (Hopcroft–Motwani–Ullman); Peter Linz",["Regular expressions & finite automata","Context-free grammars & PDA","Regular & CF languages, pumping lemma","Turing machines & undecidability"]],
["Compiler Design","Wk 9","Aho–Lam–Sethi–Ullman (Dragon Book)",["Lexical analysis","Parsing (LL, LR)","Syntax-directed translation","Runtime environments","Intermediate code generation","Local optimisation & data flow (constant propagation, liveness, CSE)"]],
["Operating System","Wk 9–10","Silberschatz–Galvin; Tanenbaum (Modern OS)",["System calls, processes, threads","Inter-process communication","Concurrency & synchronization","Deadlock","CPU & I/O scheduling","Memory management & virtual memory","File systems"]],
["Databases","Wk 11","Korth–Silberschatz–Sudarshan; Elmasri–Navathe; Ramakrishnan",["ER model","Relational algebra & tuple calculus","SQL","Integrity constraints & normal forms","File organization & indexing (B, B+ trees)","Transactions & concurrency control"]],
["Computer Networks","Wk 12","Kurose–Ross; Forouzan; Tanenbaum (Computer Networks)",["Principles of layering","Switching (circuit, packet, virtual circuit) & performance metrics","Data link: error detection, MAC, Ethernet","Distance vector & link state routing","IPv4: fragmentation, CIDR, NAT","TCP: flow & congestion control, socket API","DNS & HTTP"]],
["General Aptitude (not in PDF; 15 marks)","Daily 45 min","R.S. Aggarwal (Quant & Verbal); previous-year GATE GA papers",["Verbal: grammar, vocabulary, comprehension","Numerical: percentages, ratio, time-work, speed","Analytical & logical reasoning","Data interpretation & spatial reasoning"]]];
const R="NPTEL; Gate Smashers; Knowledge Gate; Neso Academy; Abdul Bari (Algorithms); Ravindrababu Ravula; GATE Overflow (PYQs); GO Classes; Made Easy / ACE test series. Official: GATE 2027 site (IIT Madras).";
const NAV=[["home","🏠","Home"],["sub","📚","Subjects"],["plan","🗓","Planner"],["vault","🧠","Vault"],["ana","📊","Analytics"],["rev","🔁","Revision"],["mis","📝","Mistakes"],["why","❤️","My Reason"],["data","💾","Data"]];
/* state */
const $=id=>document.getElementById(id),td=()=>new Date().toISOString().slice(0,10);
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct=(a,b)=>b?Math.round(a/b*100):0;
let D={},nav={p:"home",s:null,t:null},OP={},PI=[],vq="";
const KEY="g27",BK="g27_bk",VER=2;
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),5000)}
function load(){let raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}if(!raw)return{};
try{const o=JSON.parse(raw);if(o&&typeof o=="object"&&!Array.isArray(o))return o;throw 0}catch(e){try{localStorage.setItem("g27_corrupt",raw)}catch(_){}
try{const b=JSON.parse(localStorage.getItem(BK)||"{}"),k=Object.keys(b).sort().pop();if(k){setTimeout(()=>toast("Saved data was damaged. Restored the automatic backup from "+k+"."),0);return b[k]}}catch(_){}
setTimeout(()=>toast("Saved data was unreadable and was set aside. Starting fresh."),0);return{}}}
function fix(){if(!D||typeof D!="object"||Array.isArray(D))D={};["tk","log","mk","ms","feed","vt"].forEach(k=>{if(!Array.isArray(D[k]))D[k]=[]});["x","act","qh","rs"].forEach(k=>{if(!D[k]||typeof D[k]!="object"||Array.isArray(D[k]))D[k]={}})}
function migrate(){Object.values(D.x).forEach(o=>{if(o&&typeof o=="object")["mt","mc","pa","pc"].forEach(f=>{if(o[f]!=null)o[f]=Math.max(0,Math.round(+o[f])||0)})});D.v=VER}
function valid(o){if(!o||typeof o!="object"||Array.isArray(o))return false;for(const k of["tk","log","mk","ms","feed","vt"])if(o[k]!=null&&!Array.isArray(o[k]))return false;for(const k of["x","act","qh","rs"])if(o[k]!=null&&(typeof o[k]!="object"||Array.isArray(o[k])))return false;return true}
const backupKeys=()=>{try{return Object.keys(JSON.parse(localStorage.getItem(BK)||"{}")).sort().reverse()}catch(e){return[]}};
function autoBackup(){try{const b=JSON.parse(localStorage.getItem(BK)||"{}"),T=td();if(!b[T]){b[T]=D;Object.keys(b).sort().slice(0,-4).forEach(k=>delete b[k]);localStorage.setItem(BK,JSON.stringify(b))}}catch(e){}}
D=load();
const init=()=>{fix();D.x=D.x||{};["tk","log","mk","ms","feed","vt"].forEach(k=>D[k]=D[k]||[]);D.act=D.act||{};D.qh=D.qh||{};D.qh.used=D.qh.used||[];D.qh.hist=D.qh.hist||[];D.rs=D.rs||{};D.start=D.start||td();migrate()};init();autoBackup();
let _st=0;const flush=()=>{clearTimeout(_st);_st=0;try{D.v=VER;localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast("Could not save (storage full or blocked). Download a backup now.")}};
const save=()=>{clearTimeout(_st);_st=setTimeout(flush,250)};
addEventListener("pagehide",flush);document.addEventListener("visibilitychange",()=>{if(document.hidden)flush()});
addEventListener("error",e=>console.error(e.error));addEventListener("unhandledrejection",()=>toast("Something failed. Your data is safe."));
const X=(i,j)=>D.x[i+"-"+j]||{},WX=(i,j)=>D.x[i+"-"+j]=D.x[i+"-"+j]||{};
const log=m=>{D.feed.unshift(td()+" · "+m);D.feed=D.feed.slice(0,10)};
const all=()=>S.flatMap((s,i)=>s[3].map((t,j)=>({i,j,t,s:s[0],x:X(i,j)})));
const stat=(i,j)=>X(i,j).stat||(D[i+"s"+j]?"Done":"Not started");
const rvn=x=>(x.r1?1:0)+(x.r2?1:0)+(x.r3?1:0);
const mast=(i,j)=>{const x=X(i,j),s=stat(i,j);return Math.round((s=="Done"?25:s=="Learning"?10:0)+rvn(x)/3*25+Math.min((x.mt||0)/50,1)*25+Math.min((x.pa||0)/20,1)*25)};
const weak=(i,j)=>{const x=X(i,j);return(x.mt>0&&x.mc/x.mt<.6)||(x.pa>0&&(x.pa-x.pc)/x.pa>.2)};
const ss=i=>{let m=0,mt=0,mc=0,pa=0,pc=0;S[i][3].forEach((_,j)=>{const x=X(i,j);m+=mast(i,j);mt+=x.mt||0;mc+=x.mc||0;pa+=x.pa||0;pc+=x.pc||0});return{p:Math.round(m/S[i][3].length),ma:pct(mc,mt),pq:pct(pc,pa),mt,pn:pa,att:mt+pa,ok:mc+pc}};
const agg=()=>{const a={mt:0,pa:0,n:0,dn:0,m:0,rd:0,rt:0};all().forEach(o=>{a.n++;a.mt+=o.x.mt||0;a.pa+=o.x.pa||0;a.m+=mast(o.i,o.j);if(stat(o.i,o.j)=="Done"&&o.x.r3)a.dn++});a.p=Math.round(a.m/a.n);return a};
const evs=()=>{const r=[];all().forEach(o=>{if(o.x.sd)[[1,"r1"],[7,"r2"],[30,"r3"]].forEach(([n,f])=>r.push({t:o.t,i:o.i,j:o.j,due:add(o.x.sd,n),n,f,done:!!o.x[f]}))});return r.sort((a,b)=>a.due<b.due?-1:1)};
const streak=()=>{let n=0,d=td();if(!D.act[d])d=add(d,-1);while(D.act[d]){n++;d=add(d,-1)}return n};
const hrs=f=>(D.log.filter(l=>f(l[0])).reduce((a,l)=>a+l[1],0)/3600);
/* ui bits */
const bar=p=>`<div class="bar"><i style="width:${Math.min(100,p)}%"></i></div>`;
const ring=(p,s=64)=>{const r=s/2-6,c=2*Math.PI*r;return`<svg role="img" aria-label="${p}% complete" width="${s}" height="${s}"><circle cx="${s/2}" cy="${s/2}" r="${r}" fill="none" stroke="var(--bd)" stroke-width="6"/><circle cx="${s/2}" cy="${s/2}" r="${r}" fill="none" stroke="var(--ac)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c*p/100} ${c}" transform="rotate(-90 ${s/2} ${s/2})"/><text x="50%" y="54%" text-anchor="middle" fill="var(--fg)" font-size="${s/4.5}" font-weight="700">${p}%</text></svg>`};
const st=(l,v,s)=>`<div class="gl st"><span>${l}</span><b>${v}</b><i>${s||""}</i></div>`;
const spark=a=>{if(a.length<2)return'<p class="m">Add 2+ mocks to see a trend.</p>';const mx=Math.max(...a),mn=Math.min(...a),r=mx-mn||1;return`<svg viewBox="0 0 300 80" style="width:100%"><polyline fill="none" stroke="var(--ac)" stroke-width="2.5" points="${a.map((v,i)=>(i*300/(a.length-1)).toFixed(0)+","+(75-(v-mn)/r*70).toFixed(0)).join(" ")}"/></svg>`};
const cols=(a)=>{const mx=Math.max(...a.map(x=>x[1]),.1);return`<div class="row" style="align-items:end;height:100px;flex-wrap:nowrap">${a.map(([l,v])=>`<div style="flex:1;text-align:center;font-size:10px"><div style="background:var(--ac);height:${v/mx*70}px;border-radius:4px"></div>${v.toFixed(1)}<br>${l}</div>`).join("")}</div>`};
const fmt=ms=>new Date(ms).toISOString().slice(11,19);
const seg=(opts,cur,act,p)=>`<div class="row">${opts.map(o=>`<span class="btn ${o==cur?"on":""}" data-a="${act}" data-p="${p},${o}">${o}</span>`).join("")}</div>`;
const fld=(f,v,l,t)=>t?`<textarea rows="4" data-f="${f}" placeholder="${l}">${E(v)}</textarea>`:`<input data-f="${f}" placeholder="${l}" value="${E(v)}" style="flex:1 1 180px">`;
/* why i started */
const QC=["Father's Sacrifice","Discipline","Hard Work","Consistency","Dreams","GATE Journey","Never Give Up","Future Self","Regret Prevention","Self Respect"];
const QB=[
["The man who skipped his dreams to fund yours deserves your best effort today.","Every hour you waste is an hour your father can never get back.","Someone worked hard so you could sit here and study.","One day your father should feel relief, not worry.","When motivation disappears, remember who believed in you before success existed."],
["Discipline is studying when motivation is absent.","Success is usually boring consistency repeated daily.","Small efforts repeated daily become extraordinary results."],
["Hard work is the only shortcut that never runs out.","No one climbs a rank list by wishing.","Sweat now, or explain later.","The syllabus is finite; your effort should not be.","Ordinary effort earns ordinary results.","Work until your hardest days look like your normal days."],
["Consistency beats intensity every single time.","One focused hour daily beats one heroic weekend.","Do not break the chain.","A streak is a promise you keep to yourself.","You do not need a perfect day, just a completed one.","Miss once, return fast; never miss twice.","Slow and steady still reaches the exam hall first."],
["Your dream is not too big; your daily effort is too small.","Someone will get that seat; let it be you.","A dream with a study plan becomes a goal.","Dream company, dream college: both start at this desk.","The life you imagine is built from hours you protect.","Dream loudly, work quietly."],
["GATE is a marathon of concepts, not a sprint of tricks.","Every solved question is a brick in your rank.","Revise, practise, analyse, repeat: that is the whole journey.","Wrong answers today are marks saved on exam day.","Trust the process; the rank follows the routine.","The syllabus looks big only when you look at all of it at once."],
["You are allowed to rest, not to quit.","Bad days are part of the route, not the end of it.","The comeback begins with one page.","Failure is a plan that needs another revision.","Keep going; you are closer than you feel.","Quitting feels light for a day and heavy for years."],
["Your future self is watching what you do today.","Study for the person you will be in two years.","Be the reason your future self says thank you.","Tomorrow's confidence is built from today's practice.","Send your future self a gift: finish today's plan.","The person you want to become is made of today's choices."],
["Future regret hurts more than present effort.","The pain of studying ends. The pain of not trying stays."],
["Respect yourself enough to keep your own promises.","Every kept promise raises your self-belief.","You cannot respect yourself while avoiding your goals.","Do it so you can look in the mirror without excuses.","Self-respect is built quietly in study hours.","Choose the version of you that you would be proud of."]];
const cross=(a,b)=>a.flatMap(x=>b.map(y=>x+" "+y));
const QX={0:cross(["Your father is growing older while you are growing stronger.","Someone gave up their own comfort so you could sit at this desk.","Every rupee spent on your future was earned with tired hands.","Your father never asked for anything in return except your success.","Behind your books stands a parent who skipped many small joys.","Your family is trusting a dream they may not fully understand.","Your father worked another long day so you could study today.","The silence in your father's worry is louder than any complaint.","There are years of quiet sacrifice inside your fees and books.","Your parents have already paid for this chance in advance."],["Make his sacrifices count.","Give today your full attention.","Study as if you are repaying him one hour at a time.","Let today's effort be your thank you.","Turn his worry into pride, one page at a time.","Do not let his effort go unanswered.","Finish what he could only begin for you.","Show him that his faith was well placed.","Close the distraction and open the book.","One day he should feel relief, not worry."]),
1:cross(["Motivation is a mood; discipline is a decision.","Nobody feels like studying every day.","The syllabus does not care how you feel today.","Your routine is quietly deciding your rank.","Ambition starts a journey; habit finishes it.","Tired days are where discipline is built.","Talent is common; showing up daily is rare.","Every skipped session makes the next one easier to skip.","The desk is waiting whether you are ready or not.","A plan is only a wish until you follow it."],["Start anyway.","Do the next hour, not the whole syllabus.","Show up even for a small session.","Keep the promise you made to yourself.","Let the schedule lead when your mood does not.","Do the boring part properly.","Win the morning and the day follows.","Put the phone down and begin.","Repeat today until it becomes who you are.","Progress is made in unglamorous hours."]),

return`<h1>Mistake notebook</h1><div class="gl"><div class="row"><select id="kt">${all().map(o=>`<option value="${o.i}-${o.j}">${E(o.t.slice(0,45))}</option>`).join("")}</select><select id="ky"><option>Concept Gap</option><option>Calculation Error</option><option>Silly Mistake</option><option>Guess</option></select></div><div class="row"><input id="kq" placeholder="Question" style="flex:1 1 180px"><input id="ka" placeholder="Correct answer"><input id="kw" placeholder="Why it happened" style="flex:1 1 180px"><span class="btn on" data-a="ak" data-p="|k">Add</span></div></div>
<div class="g2" style="margin-top:12px"><div class="gl"><h3>Most repeated mistake types</h3>${Object.entries(ty).sort((a,b)=>b[1]-a[1]).map(([a,b])=>`<div>${a} <b>${b}</b></div>`).join("")||'<p class="m">None yet.</p>'}</div><div class="gl"><h3>Frequently missed topics</h3>${top.map(([t,n])=>`<div>${E(topicName(t))} <b>${n}</b></div>`).join("")||'<p class="m">None yet.</p>'}</div></div><div class="gl" style="margin-top:12px">${D.mk.map((m,i)=>`<div class="row"><span style="flex:1"><b>${E(topicName(m.topic))}</b> <span class="tag">${E(m.type)}</span><br>${E(m.q)} → ${E(m.a)}<br><span class="m">${E(m.w)}</span></span><span class="btn" data-a="dk" data-p="${i}">✕</span></div>`).join("")}</div>`}
const data=()=>`<h1>Data & backup</h1><div class="gl"><p class="m">Everything is stored locally in this browser. Export regularly.</p><textarea id="js" rows="8">${E(JSON.stringify(D))}</textarea><div class="row"><span class="btn on" data-a="dl">Download backup</span><span class="btn" data-a="cp">Copy JSON</span><span class="btn" data-a="im">Import from box</span></div><div class="row"><label class="m" for="rbs">Automatic backups</label><select id="rbs">${backupKeys().map(k=>`<option>${k}</option>`).join("")}</select><span class="btn" data-a="rb">Restore</span></div></div>`;
const V={home,sub:subjects,plan,vault,ana,rev,mis,why,data};
/* AI (runtime sample capability) */
async function ask(p){const s=window.claude&&await claude.use("sample");if(!s){toast("AI is only available when this page is opened in Claude.");return null}try{return(await s(p)).text}catch(e){toast("AI request failed: "+(e.code||""));return null}}
const G="You help a GATE CSE 2027 aspirant. Use plain text with clear section headings, no markdown symbols, concise and exam-focused.\n\n";
/* actions */
const mkAdd=(t,pre)=>{const q=$(pre+"q").value.trim();if(q){D.mk.push({topic:t||$("kt").value,q,a:$(pre+"a").value,w:$(pre+"w").value,type:$(pre+"y").value});log("Mistake logged")}};
const A={gp:p=>go(p),os:p=>go("sub",+p),ot:p=>{const[i,j]=p.split(",");go("sub",+i,+j)},
stat:p=>{const[k,v]=p.split(","),x=D.x[k]=D.x[k]||{};x.stat=v;const[i,j]=k.split("-");D[i+"s"+j]=v=="Done";if(v!="Not started"&&!x.sd)x.sd=td();log(v+": "+topicName(k))},
rv:p=>{const[k,n]=p.split(","),x=D.x[k]=D.x[k]||{};x.r1=n>=1;x.r2=n>=2;x.r3=n>=3;if(n>0&&!x.sd)x.sd=td()},
cf:p=>{const[k,v]=p.split(",");(D.x[k]=D.x[k]||{}).cf=v},
rd:p=>{const[i,j,f]=p.split(",");WX(i,j)[f]=true;log("Revised: "+S[i][3][j])},
at:()=>{const t=$("tt").value.trim();if(t)D.tk.push({t,p:$("tp").value,dl:$("tdl").value,d:false})},
tg:p=>{const t=D.tk[+p];t.d=!t.d;if(t.d)log("Task done: "+t.t)},dt:p=>D.tk.splice(+p,1),
tm:()=>{if(D.run){D.log.push([td(),Math.round((Date.now()-D.run)/1000)]);D.run=null;log("Study session saved")}else D.run=Date.now()},
am:()=>{const n=$("mn").value.trim();if(n){D.ms.push({name:n,date:td(),marks:$("mm").value,rank:$("mr").value});log("Mock added: "+n)}},
ak:p=>{const[t,pre]=p.split("|");mkAdd(t,pre)},dk:p=>D.mk.splice(+p,1),
av:()=>{const t=$("vti").value.trim();if(t){D.vt.unshift({id:Date.now(),type:$("vy").value,title:t,channel:$("vch").value,dur:$("vdu").value,url:$("vurl").value,tp:$("vtp").value,text:$("vtx").value,date:td(),v:[]});log("Vault: "+t)}},dv:p=>{D.vt=D.vt.filter(v=>v.id!=p)},
ais:async(p,b)=>{const[id,m]=p.split("|"),v=D.vt.find(x=>x.id==id);b.textContent="Working…";const o=await ask(G+(m=="sum"?"From this lecture material produce sections: AI Summary, Important Concepts, Formula Sheet, Key Takeaways, Frequently Asked Questions, Revision Notes.":"Turn these raw notes into sections: Clean Notes, Exam Notes, Short Revision Notes, Formula Notes, One-page Summary, Last-minute Revision Sheet.")+"\n\nTitle: "+v.title+"\n\n"+v.text.slice(0,12000));if(o){v.v.unshift({d:td(),mode:m,out:o});OP["v"+id]=true}},
aits:async(k,b)=>{const x=D.x[k]||{};if(!x.nx){toast("Write some notes first.");return}b.textContent="Working…";const o=await ask(G+"Summarize these notes on '"+topicName(k)+"' into key points, formulas and likely exam traps:\n\n"+x.nx.slice(0,12000));if(o){x.ai=o;OP[k+"a"]=true}},
cp:()=>{try{navigator.clipboard.writeText(JSON.stringify(D))}catch(e){$("js").select()}},
dl:async()=>{const d=window.claude&&await claude.use("downloads");if(d)try{await d.save({filename:"gate2027-backup.json",data:JSON.stringify(D)});return}catch(e){toast("Download cancelled or failed. Copy the JSON below instead.")}$("js").select()},
im:()=>{try{const o=JSON.parse($("js").value);if(!valid(o))throw new Error("shape");try{const b=JSON.parse(localStorage.getItem(BK)||"{}");b[td()+" pre-import"]=D;localStorage.setItem(BK,JSON.stringify(b))}catch(e){}D=o;init();flush();toast("Import complete. Your previous data was kept in automatic backups.")}catch(e){toast("Import failed: not a valid backup. Nothing was changed.")}},
pk:p=>{$("pal").hidden=true;PI[+p].f()}};
const go=(p,s=null,t=null)=>{nav={p,s,t};$("sb").classList.remove("open");const v=$("v");v.classList.add("ani");setTimeout(()=>v.classList.remove("ani"),450);render();scrollTo(0,0)};
function render(){set("sb",sidebar());document.body.classList.toggle("fz",!!D.focus);set("v",view());const s=$("vs");if(s)s.oninput=()=>{vq=s.value;const p=s.selectionStart;render();$("vs").focus();$("vs").setSelectionRange(p,p)};enhance()}
A.fz=()=>{D.focus=!D.focus};A.mo=()=>$("sb").classList.toggle("open");A.rb=()=>{try{const o=JSON.parse(localStorage.getItem(BK)||"{}")[$("rbs").value];if(!valid(o))throw 0;D=JSON.parse(JSON.stringify(o));init();flush();toast("Backup restored.")}catch(e){toast("Could not restore that backup.")}};A.op=()=>openPal();A.th=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme=="dark"?"light":"dark"};
document.addEventListener("click",async e=>{const b=e.target.closest("[data-a]");if(!b)return;const f=A[b.dataset.a];if(!f)return;const r=f(b.dataset.p,b);if(r&&r.then)await r;D.act[td()]=1;save();if(b.dataset.a!="cp"&&b.dataset.a!="th")render()});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.r){if(t.dataset.r=="_gd")D.gd=t.value;else D.rs[t.dataset.r]=t.value;RL=pickRL();save();return}if(!t.dataset.f)return;const[k,f]=t.dataset.f.split("."),o=D.x[k]=D.x[k]||{};o[f]=t.type=="number"?Math.min(1e5,Math.max(0,Math.round(+t.value)||0)):t.value;if((o.mc||0)>(o.mt||0))o.mt=o.mc;if((o.pc||0)>(o.pa||0))o.pa=o.pc;D.act[td()]=1;save();render()});
document.addEventListener("toggle",e=>{if(e.target.dataset&&e.target.dataset.o)OP[e.target.dataset.o]=e.target.open},true);
function pal(q){q=q.toLowerCase();const h=s=>String(s||"").toLowerCase().includes(q),r=[];
NAV.forEach(n=>h(n[2])&&r.push({l:n[1]+" "+n[2],s:"Page",f:()=>go(n[0])}));
S.forEach((s,i)=>h(s[0])&&r.push({l:s[0],s:"Subject",f:()=>go("sub",i)}));
all().forEach(o=>(h(o.t)||h(o.x.nx)||h(o.x.fm)||h(o.x.bk))&&r.push({l:o.t,s:o.s,f:()=>go("sub",o.i,o.j)}));
D.vt.forEach(v=>(h(v.title)||h(v.text))&&r.push({l:v.title,s:"Vault · "+v.type,f:()=>{vq=q;go("vault")}}));
D.mk.forEach(m=>(h(m.q)||h(m.w)||h(m.a))&&r.push({l:m.q,s:"Mistake",f:()=>go("mis")}));
PI=r.slice(0,12);$("pr").innerHTML=PI.map((x,i)=>`<div class="pi" data-a="pk" data-p="${i}"><b>${E(x.l)}</b><span>${E(x.s)}</span></div>`).join("")||'<p class="m">No results</p>'}
function openPal(){$("pal").hidden=false;$("pq").value="";pal("");enhance();$("pq").focus()}
$("pq").oninput=()=>{pal($("pq").value);enhance()};$("pal").onclick=e=>{if(e.target.id=="pal")$("pal").hidden=true};
addEventListener("keydown",e=>{const inp=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName),po=!$("pal").hidden;
if((e.ctrlKey||e.metaKey)&&e.key=="k"||(!inp&&e.key=="/")){e.preventDefault();openPal()}
else if(e.key=="Escape")$("pal").hidden=true;
else if(e.key=="Enter"&&po&&PI[0]){$("pal").hidden=true;PI[0].f()}
else if(!inp&&!po&&e.key=="f"){A.fz();save();render()}else if(!inp&&!po&&/^[1-9]$/.test(e.key)){D.focus=false;go(NAV[e.key-1][0])}});
setInterval(()=>{const e=$("tm");if(e&&D.run)e.textContent=fmt(Date.now()-D.run)},1000);
render();setTimeout(()=>$("v").classList.remove("ani"),1500);
</script></body></html>
